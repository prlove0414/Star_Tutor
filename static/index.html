<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星学伴 — AI 数学教师</title>
<link rel="stylesheet" href="/lib/katex.min.css">
<script src="/lib/katex.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background:#f5f5f5; display:flex; height:100vh; }
#sidebar { width:260px; background:#1e1b4b; color:#e0e7ff; display:flex; flex-direction:column; flex-shrink:0; }
#sidebar h2 { padding:16px; font-size:16px; border-bottom:1px solid #312e81; text-align:center; }
#sidebar button.new { margin:12px; padding:10px; background:#4f46e5; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
#sidebar button.new:hover { background:#4338ca; }
#session-list { flex:1; overflow-y:auto; padding:0 8px; }
.session-item { padding:10px 12px; margin:2px 0; border-radius:8px; cursor:pointer; font-size:13px; color:#c7d2fe; display:flex; align-items:center; justify-content:space-between; }
.session-item .title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.session-item:hover { background:#312e81; }
.session-item.active { background:#4f46e5; color:#fff; }
.session-item .menu-btn { visibility:hidden; background:none; border:none; color:#c7d2fe; font-size:16px; cursor:pointer; padding:0 4px; line-height:1; }
.session-item:hover .menu-btn { visibility:visible; }
.session-item .menu-btn:hover { color:#fff; }
.dropdown { position:absolute; background:#312e81; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:100; min-width:100px; padding:4px 0; }
.dropdown div { padding:8px 16px; font-size:13px; cursor:pointer; color:#c7d2fe; }
.dropdown div:hover { background:#4f46e5; color:#fff; }
.dropdown div.danger { color:#fca5a5; }
.dropdown div.danger:hover { background:#dc2626; color:#fff; }
#main { flex:1; display:flex; flex-direction:column; min-width:0; }
header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color:#fff; padding:12px 20px; font-size:18px; font-weight:600; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.7; font-size:15px; }
.msg.user { align-self:flex-end; background:#4f46e5; color:#fff; }
.msg.bot { align-self:flex-start; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.1); }
.msg.bot .math-block { display:block; margin:8px 0; overflow-x:auto; text-align:center; }
.msg.bot .math-inline { }
.msg img { max-width:100%; margin-top:8px; border-radius:8px; border:1px solid #e5e7eb; }
#input-area { display:flex; gap:8px; padding:12px 16px; background:#fff; border-top:1px solid #e5e7eb; }
#input-area input { flex:1; padding:10px 14px; border:1px solid #d1d5db; border-radius:20px; font-size:15px; outline:none; }
#input-area input:focus { border-color:#4f46e5; }
#input-area button { padding:10px 20px; background:#4f46e5; color:#fff; border:none; border-radius:20px; font-size:15px; cursor:pointer; }
#input-area button:hover { background:#4338ca; }
#input-area label.up { padding:10px 14px; background:#e5e7eb; color:#374151; border-radius:20px; font-size:18px; cursor:pointer; line-height:1; }
#input-area label.up:hover { background:#d1d5db; }
.loading { color:#9ca3af; font-style:italic; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>🐧 星学伴</h2>
  <button class="new" onclick="newSession()">＋ 新对话</button>
  <div id="session-list"></div>
</div>
<div id="main">
  <header id="header-title">星学伴 · AI 数学教师</header>
  <div id="chat"></div>
  <div id="input-area">
    <div id="img-preview" style="display:none;position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;flex-shrink:0;border:2px solid #4f46e5;">
      <img id="img-preview-thumb" src="" style="width:100%;height:100%;object-fit:cover;">
      <span id="img-preview-close" onclick="cancelImage()" style="position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:0 10px 0 8px;font-size:11px;line-height:18px;text-align:center;cursor:pointer;">✕</span>
    </div>
    <label class="up" title="拍照上传">📷<input type="file" accept="image/*" hidden onchange="uploadImage(this)"></label>
    <input id="msg-input" placeholder="输入数学问题..." autofocus onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
let sessionId = '';
let sessionList = [];
let katexReady = false;
let pendingImage = null;   // 待发送的图片文件

// 等 KaTeX 加载完
document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(() => {
    if (typeof katex !== 'undefined') { katexReady = true; clearInterval(check); }
  }, 200);
  setTimeout(() => clearInterval(check), 10000);
});

function renderMath(text) {
  if (typeof katex === 'undefined') {
    console.warn('[KaTeX] not loaded, falling back to plain text');
    return escapeHtml(text).replace(/\n/g, '<br>');
  }

  // 处理 $$...$$ 块级公式
  let html = text;
  html = html.replace(/\$\$([\s\S]*?)\$\$/g, (_, f) => {
    try { return '<span class="math-block">' + katex.renderToString(f.trim(), {displayMode:true, throwOnError:false}) + '</span>'; }
    catch(e) { return '<code>' + escapeHtml(f) + '</code>'; }
  });
  // 处理 \[...\] 块级公式
  html = html.replace(/\\\[([\s\S]*?)\\\]/g, (_, f) => {
    try { return '<span class="math-block">' + katex.renderToString(f.trim(), {displayMode:true, throwOnError:false}) + '</span>'; }
    catch(e) { return '<code>' + escapeHtml(f) + '</code>'; }
  });
  // 处理 $...$ 行内公式
  html = html.replace(/\$(.+?)\$/g, (_, f) => {
    try { return '<span class="math-inline">' + katex.renderToString(f.trim(), {displayMode:false, throwOnError:false}) + '</span>'; }
    catch(e) { return '<code>' + escapeHtml(f) + '</code>'; }
  });
  // 处理 \(...\) 行内公式
  html = html.replace(/\\\((.+?)\\\)/g, (_, f) => {
    try { return '<span class="math-inline">' + katex.renderToString(f.trim(), {displayMode:false, throwOnError:false}) + '</span>'; }
    catch(e) { return '<code>' + escapeHtml(f) + '</code>'; }
  });
  // 换行、加粗
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadSessions() {
  const resp = await fetch('/api/sessions');
  const data = await resp.json();
  sessionList = data.sessions || [];
  renderSidebar();
}

function renderSidebar() {
  const el = document.getElementById('session-list');
  el.innerHTML = sessionList.map(s => {
    const cls = s.id === sessionId ? 'session-item active' : 'session-item';
    return `<div class="${cls}">
      <span class="title" onclick="switchSession('${s.id}')">${escapeHtml(s.title || '新对话')}</span>
      <button class="menu-btn" onclick="event.stopPropagation();toggleMenu(event, '${s.id}')">⋯</button>
    </div>`;
  }).join('');
}

let openMenuSid = null;

function toggleMenu(e, sid) {
  closeMenu();
  openMenuSid = sid;
  const menu = document.createElement('div');
  menu.className = 'dropdown';
  menu.id = 'ctx-menu';
  menu.innerHTML = `
    <div onclick="renameSession('${sid}')">✏ 重命名</div>
    <div class="danger" onclick="deleteSession('${sid}')">🗑 删除</div>
  `;
  const rect = e.target.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
}

function closeMenu() {
  openMenuSid = null;
  const m = document.getElementById('ctx-menu');
  if (m) m.remove();
  document.removeEventListener('click', closeMenu);
}

async function renameSession(sid) {
  closeMenu();
  const item = sessionList.find(s => s.id === sid);
  const newTitle = prompt('重命名会话：', item?.title || '');
  if (!newTitle || newTitle === item?.title) return;
  await fetch(`/api/session/${sid}/rename`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: newTitle })
  });
  await loadSessions();
}

async function deleteSession(sid) {
  closeMenu();
  const item = sessionList.find(s => s.id === sid);
  if (!confirm(`确定删除「${item?.title || '新对话'}」？\\n此操作不可撤销。`)) return;
  await fetch(`/api/session/${sid}`, { method: 'DELETE' });
  // 如果删的是当前会话，切到第一个或新建
  if (sessionId === sid) {
    await loadSessions();
    if (sessionList.length > 0) switchSession(sessionList[0].id);
    else newSession();
  } else {
    await loadSessions();
  }
}

async function newSession() {
  const resp = await fetch('/api/session/new', { method:'POST' });
  const data = await resp.json();
  sessionId = data.session_id;
  document.getElementById('chat').innerHTML = '';
  append('bot', data.message);
  document.getElementById('header-title').textContent = '新对话';
  await loadSessions();
}

async function switchSession(sid) {
  sessionId = sid;
  document.getElementById('chat').innerHTML = '<div class="msg bot loading">加载中...</div>';
  renderSidebar();
  try {
    const resp = await fetch(`/api/session/${sid}/history`);
    const data = await resp.json();
    document.getElementById('chat').innerHTML = '';
    document.getElementById('header-title').textContent = sessionList.find(s=>s.id===sid)?.title || '历史对话';
    for (const m of data.messages || []) {
      if (m.role === 'user') append('user', m.content);
      else if (m.role === 'assistant') append('bot', m.content);
    }
  } catch(e) {
    document.getElementById('chat').innerHTML = '<div class="msg bot">加载失败</div>';
  }
}

function append(role, text, images = []) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'bot') {
    div.innerHTML = renderMath(text);
  } else {
    div.textContent = text;
  }
  if (images.length) {
    images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = '配图';
      div.appendChild(img);
    });
  }
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

async function uploadImage(input) {
  const file = input.files[0];
  if (!file || !sessionId) return;
  pendingImage = file;
  // 显示预览缩略图
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('img-preview-thumb').src = e.target.result;
    document.getElementById('img-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function cancelImage() {
  pendingImage = null;
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('img-preview-thumb').src = '';
  document.getElementById('msg-input').focus();
}

function addLoading(text) {
  const d = document.createElement('div');
  d.className = 'msg bot loading';
  d.textContent = text;
  document.getElementById('chat').appendChild(d);
  return d;
}

async function send() {
  const input = document.getElementById('msg-input');
  const msg = input.value.trim();
  if ((!msg && !pendingImage) || !sessionId) return;
  input.value = '';

  const hasImage = !!pendingImage;

  if (hasImage) {
    // 显示用户消息：图片名 + 文字
    const display = msg ? '📷 ' + pendingImage.name + '\n' + msg : '📷 ' + pendingImage.name;
    append('user', display);
  } else {
    append('user', msg);
  }

  const loading = addLoading('思考中...');
  try {
    let data;
    if (hasImage) {
      const fd = new FormData();
      fd.append('image', pendingImage);
      if (msg) fd.append('message', msg);
      const resp = await fetch(`/api/upload/${sessionId}`, { method: 'POST', body: fd });
      data = await resp.json();
    } else {
      const resp = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: msg })
      });
      data = await resp.json();
    }
    loading.remove();
    append('bot', data.reply, data.images || []);
    await loadSessions();
  } catch (e) {
    loading.remove();
    append('bot', '出错了 😢');
  }

  // 清除待发送图片
  cancelImage();
}

init: {
  loadSessions().then(() => {
    if (sessionList.length > 0) switchSession(sessionList[0].id);
    else newSession();
  });
}
</script>
</body>
</html>
